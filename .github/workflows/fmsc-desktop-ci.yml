name: '09 - CI - Desktop Build and Regression'

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [feature/student-certificates-workspace]
    paths:
      - '.github/workflows/fmsc-desktop-ci.yml'

permissions:
  contents: read

concurrency:
  group: fmsc-desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build and portable regression checks
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate release versions and permission consumers
        run: python -m unittest discover -s Tools -p 'test_*.py' -v

      - name: Restore application
        run: dotnet restore FMSC_SMS.sln

      - name: Build desktop application (Release)
        run: dotnet build FMSC_SMS.sln -c Release --no-restore

      - name: Compile native WinForms smoke checks
        run: dotnet build Tests/ThemeSmokeChecks/ThemeSmokeChecks.csproj -c Release

      - name: Capture student certificate workspace and all eight compact editors
        shell: pwsh
        timeout-minutes: 4
        run: |
          dotnet run --project Tests/ThemeSmokeChecks/ThemeSmokeChecks.csproj -c Release --no-build -- --student-certificates-screenshots
          if ($LASTEXITCODE -ne 0) { throw 'Certificate dialog capture/layout checks failed.' }

      - name: Upload Windows certificate preview images and layout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: student-certificates-workspace-preview-${{ github.run_id }}
          path: |
            artifacts/student-certificates-preview/*.png
            artifacts/student-certificates-preview/layout-*.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Run focused post-fix Windows control contracts
        # The fixtures are SQL-free and normally complete rapidly; fail fast
        # rather than leaving a modal UI regression hung for five minutes.
        timeout-minutes: 2
        run: dotnet run --project Tests/ThemeSmokeChecks/ThemeSmokeChecks.csproj -c Release --no-build -- --post-fix

      - name: Run targeted admission, placement and finance regressions
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $suites = @('--direct-pdf-review', '--finance-report-async', '--spreadsheet-export', '--action-shortcuts', '--report-ordering', '--saved-report-views', '--report-purpose', '--class-section-setup', '--registration-workflow', '--placement-workspace', '--fee-account', '--fee-documents', '--collection-fee-actions', '--student-purchase-collection', '--billing-grid', '--student-certificates-workspace')
          foreach ($suite in $suites) {
            Write-Output "Checking $suite"
            & dotnet run --project Tests/ThemeSmokeChecks/ThemeSmokeChecks.csproj -c Release --no-build -- $suite
            if ($LASTEXITCODE -ne 0) { throw "$suite failed with exit code $LASTEXITCODE" }
          }

      - name: Retain the single direct-export review PDF
        # Fictional fixture data only. These files use the production export
        # builder and Windows PDF renderer, rather than a recreated layout.
        if: ${{ always() && hashFiles('artifacts/direct-pdf-review/REVIEW-ALL.pdf') != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/direct-pdf-review/REVIEW-ALL.pdf
          archive: false
          retention-days: 7
          if-no-files-found: error

      - name: Run Level 3 noninteractive resource and export checks
        timeout-minutes: 5
        env:
          FMSC_LEVEL3_WINDOWS_EVIDENCE: ${{ runner.temp }}/fmsc-level3-windows
        run: dotnet run --project Tests/ThemeSmokeChecks/ThemeSmokeChecks.csproj -c Release --no-build -- --level3

      - name: Upload sanitized Windows component measurements
        uses: actions/upload-artifact@v7
        with:
          name: fmsc-level3-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/fmsc-level3-windows/report.json
          retention-days: 7
          if-no-files-found: error

      - name: Run portable audit regression checks
        run: dotnet run --project Tests/AuditFixChecks/AuditFixChecks.csproj -c Release

      - name: Run report data and RDLC regressions
        run: |
          dotnet run --project Tests/ReportReadChecks/ReportReadChecks.csproj -c Release
          dotnet run --project Tests/ReportRdlcChecks/ReportRdlcChecks.csproj -c Release

      - name: Run offline Help Center catalog and search checks
        run: dotnet run --project Tests/HelpChecks/HelpChecks.csproj -c Release

      - name: Run synthetic performance and state checks
        run: dotnet run --project Tests/PerformanceChecks/PerformanceChecks.csproj -c Release

      - name: Test LocalDB MSI recovery without running an installer
        shell: pwsh
        run: .\Tools\TestInstallerLocalDb.ps1

      - name: Test migration discovery, versions and backup ordering
        shell: powershell
        run: .\Tools\TestInstallerMigrations.ps1

      - name: Build optional communication worker and webhook host
        run: |
          dotnet build Apps/Worker/Worker.csproj -c Release
          dotnet build Apps/Host/Host.csproj -c Release

      - name: Run deterministic communication provider checks (no live delivery)
        run: dotnet run --project Tests/CommunicationChecks/CommunicationChecks.csproj -c Release

      - name: Verify disposable publish and module isolation
        shell: pwsh
        run: .\Tools\TestPublishPowerShell.ps1 -ProjectDirectory .

# Safety boundaries:
# - No installation, signing or release upload. Publish regression output uses
#   a disposable readability fixture, never a deployable LocalDB MSI/package.
# - Genuine complete-installer packaging separately verifies the Microsoft MSI;
#   fresh installations require the owner's detached compatible MDF/LDF.
# - No SQL mutation/integration tests: those require a disposable test database.
# - Only offline control, admission, placement, finance and document suites execute
#   here, with injected reads and no school SQL connection.
# - Full native UI/DPI/printing acceptance needs an interactive Windows desktop.
