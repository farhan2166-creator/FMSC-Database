name: '09 - CI - Desktop Build and Regression'

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'Core/Updates/**'
      - 'Core/MaintenanceTools.cs'
      - 'Core/SqlDependencyRepair.cs'
      - 'Installer/**'
      - 'Tools/*Maintenance*.ps1'
      - 'Tools/TestOfflineSqlPrerequisites.ps1'
      - 'FMSC_SMS.csproj'
      - 'Tools/PrepareBundledGit.ps1'
      - 'Tools/TestPublishPowerShell.ps1'
      - '.github/workflows/fmsc-desktop-ci.yml'
  push:
    branches: ['feature/private-incremental-updates']

permissions:
  contents: read

concurrency:
  group: fmsc-desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build and portable regression checks
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate release versions and permission consumers
        run: python -m unittest discover -s Tools -p 'test_*.py' -v

      - name: Validate SHA-256 incremental/full packages and isolated staging
        run: dotnet run --project Tools/UpdatePackages/UpdatePackages.csproj -c Release -- --self-test

      - name: Validate two-version checked distribution snapshots and retirement
        run: dotnet run --project Tools/UpdateDistribution/UpdateDistribution.csproj -c Release -- --self-test

      - name: Refuse unintended private publication triggers without network access
        shell: pwsh
        run: .\Tools\TestPublishPrivateUpdate.ps1

      - name: Validate private Git SSH key enrollment and Windows DPAPI protection
        run: dotnet run --project Tests/UpdateAuthorizationChecks/UpdateAuthorizationChecks.csproj -c Release

      - name: Restore application
        run: dotnet restore FMSC_SMS.sln

      - name: Build desktop application (Release)
        run: dotnet build FMSC_SMS.sln -c Release --no-restore

      - name: Compile native WinForms smoke checks
        run: dotnet build Tests/ThemeSmokeChecks/ThemeSmokeChecks.csproj -c Release

      - name: Verify maintenance tool lifecycle without downloads or SQL
        shell: pwsh
        run: .\Tools\TestMaintenanceTools.ps1

      - name: Run focused post-fix Windows control contracts
        # The fixtures are SQL-free and normally complete rapidly; fail fast
        # rather than leaving a modal UI regression hung for five minutes.
        timeout-minutes: 2
        run: dotnet run --project Tests/ThemeSmokeChecks/ThemeSmokeChecks.csproj -c Release --no-build -- --post-fix

      - name: Verify modeless update dismissal and accepted-close installer handoff
        timeout-minutes: 2
        run: dotnet run --project Tests/ThemeSmokeChecks/ThemeSmokeChecks.csproj -c Release --no-build -- --update-dialog

      - name: Run targeted admission, placement and finance regressions
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $suites = @('--direct-pdf-review', '--finance-report-async', '--spreadsheet-export', '--action-shortcuts', '--report-ordering', '--saved-report-views', '--report-purpose', '--class-section-setup', '--registration-workflow', '--placement-workspace', '--fee-account', '--fee-documents', '--collection-fee-actions', '--student-purchase-collection', '--billing-grid')
          foreach ($suite in $suites) {
            Write-Output "Checking $suite"
            & dotnet run --project Tests/ThemeSmokeChecks/ThemeSmokeChecks.csproj -c Release --no-build -- $suite
            if ($LASTEXITCODE -ne 0) { throw "$suite failed with exit code $LASTEXITCODE" }
          }

      - name: Retain the dashboard report review PDF
        # Fictional fixture data only. These files use the production export
        # builder and Windows PDF renderer, rather than a recreated layout.
        if: ${{ always() && hashFiles('artifacts/direct-pdf-review/FMSC-Dashboard-Reports-Review.pdf') != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/direct-pdf-review/FMSC-Dashboard-Reports-Review.pdf
          archive: false
          retention-days: 7
          if-no-files-found: error

      - name: Run Level 3 noninteractive resource and export checks
        timeout-minutes: 5
        env:
          FMSC_LEVEL3_WINDOWS_EVIDENCE: ${{ runner.temp }}/fmsc-level3-windows
        run: dotnet run --project Tests/ThemeSmokeChecks/ThemeSmokeChecks.csproj -c Release --no-build -- --level3

      - name: Upload sanitized Windows component measurements
        uses: actions/upload-artifact@v7
        with:
          name: fmsc-level3-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/fmsc-level3-windows/report.json
          retention-days: 7
          if-no-files-found: error

      - name: Run portable audit regression checks
        run: dotnet run --project Tests/AuditFixChecks/AuditFixChecks.csproj -c Release

      - name: Run report data and RDLC regressions
        run: |
          dotnet run --project Tests/ReportReadChecks/ReportReadChecks.csproj -c Release
          dotnet run --project Tests/ReportRdlcChecks/ReportRdlcChecks.csproj -c Release

      - name: Run offline Help Center catalog and search checks
        run: dotnet run --project Tests/HelpChecks/HelpChecks.csproj -c Release

      - name: Run synthetic performance and state checks
        run: dotnet run --project Tests/PerformanceChecks/PerformanceChecks.csproj -c Release

      - name: Test LocalDB MSI recovery without running an installer
        shell: pwsh
        run: .\Tools\TestInstallerLocalDb.ps1

      - name: Test migration discovery, versions and backup ordering
        shell: powershell
        run: .\Tools\TestInstallerMigrations.ps1

      - name: Verify normal launcher creates no PowerShell console
        shell: powershell
        run: .\Tools\TestWindowlessLauncher.ps1

      - name: Test prepared update installer integrity without touching SQL
        shell: powershell
        run: .\Tools\TestPreparedUpdate.ps1

      - name: Test successful update cleanup and recovery preservation
        shell: powershell
        run: .\Tools\TestUpdateCleanup.ps1

      - name: Force interruption and recover activation using disposable folders
        shell: pwsh
        run: |
          & .\Tools\TestUpdateRecovery.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Tools\TestUpdateRecovery.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell recovery checks failed.' }

      - name: Build optional communication worker and webhook host
        run: |
          dotnet build Apps/Worker/Worker.csproj -c Release
          dotnet build Apps/Host/Host.csproj -c Release

      - name: Run deterministic communication provider checks (no live delivery)
        run: dotnet run --project Tests/CommunicationChecks/CommunicationChecks.csproj -c Release

      - name: Verify offline sqlcmd resolution for new installs and updates
        shell: pwsh
        run: .\Tools\TestOfflineSqlPrerequisites.ps1

      - name: Verify disposable publish and module isolation
        shell: pwsh
        run: .\Tools\TestPublishPowerShell.ps1 -ProjectDirectory .

      - name: Verify real pinned MinGit and app-only publish integration
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ('fmsc-transport-verify-' + [Guid]::NewGuid().ToString('N'))
          $transport = Join-Path $root 'MinGit'
          $application = Join-Path $root 'Application'
          $msi = Join-Path $root 'synthetic-LocalDB.msi'
          $sqlCmd = Join-Path $root 'synthetic-sqlcmd.exe'
          try {
            New-Item -ItemType Directory -Path $root -Force | Out-Null
            Set-Content -LiteralPath $msi -Value 'Disposable fixture only'
            Set-Content -LiteralPath $sqlCmd -Value 'Disposable fixture only'
            & .\Tools\PrepareBundledGit.ps1 -DestinationDirectory $transport
            foreach($pair in @(@('SqlCmd','sqlcmd.exe',$sqlCmd),@('LocalDb','SqlLocalDB.msi',$msi))){
              $folder=Join-Path $root $pair[0]
              New-Item -ItemType Directory -Path $folder | Out-Null
              Copy-Item -LiteralPath $pair[2] -Destination (Join-Path $folder $pair[1])
            }
            dotnet publish FMSC_SMS.csproj -c Release -r win-x64 --self-contained true --output $application -p:CIAppOnlyBundle=true "-p:BundledGitDirectory=$transport" "-p:LocalDbMsiPath=$msi" "-p:BundledSqlCmdPath=$sqlCmd" -p:FmscSyntheticPublishFixture=true -p:PublishSingleFile=false -p:PublishTrimmed=false
            if ($LASTEXITCODE -ne 0) { throw 'Bundled updater smoke publish failed.' }
            foreach ($relative in @('UpdateTransport/cmd/git.exe','UpdateTransport/usr/bin/ssh.exe',
                'UpdateTransport/COPYING-GIT.txt','UpdateTransport/THIRD_PARTY_NOTICES.txt',
                'UpdateSupport/Tools/SqlCmd/sqlcmd.exe','UpdateSupport/Tools/LocalDb/SqlLocalDB.msi')) {
              if (-not (Test-Path -LiteralPath (Join-Path $application $relative) -PathType Leaf)) {
                throw "Published Git/SSH runtime is incomplete: $relative"
              }
            }
            & (Join-Path $application 'UpdateTransport/cmd/git.exe') --version
            if ($LASTEXITCODE -ne 0) { throw 'Published Git could not start.' }
            & (Join-Path $application 'UpdateTransport/usr/bin/ssh.exe') -V 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Published OpenSSH could not start.' }
          } finally {
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          }

# Safety boundaries:
# - No installation, signing or release upload. Publish regression output uses
#   a disposable readability fixture, never a deployable LocalDB MSI/package.
# - Genuine complete-installer packaging separately verifies the Microsoft MSI;
#   fresh installations require the owner's detached compatible MDF/LDF.
# - No SQL mutation/integration tests: those require a disposable test database.
# - Only offline control, admission, placement, finance and document suites execute
#   here, with injected reads and no school SQL connection.
# - Full native UI/DPI/printing acceptance needs an interactive Windows desktop.
