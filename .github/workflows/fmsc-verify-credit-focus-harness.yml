name: '13 - Verification - Credit and Collection Test Harness'
on:
  push:
    branches:
      - fix/test-harness-credit-focus-20261104
permissions:
  contents: read
jobs:
  targeted-winforms:
    name: Native synthetic collection smoke checks
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build synthetic WinForms checks
        shell: pwsh
        run: |
          dotnet build Tests/ThemeSmokeChecks/ThemeSmokeChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run affected collection controls
        shell: pwsh
        timeout-minutes: 10
        run: |
          $failures=@()
          foreach($suite in @('--collection-counter-layout','--collection-allocation','--collection-sibling-navigation','--collection-inline-amounts','--search-selection')) {
            Write-Host "START $suite"
            dotnet run --project Tests/ThemeSmokeChecks/ThemeSmokeChecks.csproj -c Release --no-build -- $suite
            if ($LASTEXITCODE -ne 0) { $failures += "$suite ($LASTEXITCODE)"; Write-Host "FAIL $suite" }
            else { Write-Host "PASS $suite" }
          }
          if ($failures.Count -gt 0) { throw ("Failed: " + ($failures -join ', ')) }
  disposable-sql:
    name: Test updated SQL contract on isolated synthetic database
    uses: ./.github/workflows/fmsc-lifecycle-sql-ci.yml
