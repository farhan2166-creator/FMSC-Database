name: '06 - Review - Fee Bills and Payment Receipts'

on:
  workflow_dispatch:
  push:
    branches: [main, test/fee-document-scenario-pack, fix/pdf-review-fidelity]
    paths:
      - 'Core/Reports/Fees/**'
      - 'Pages/Reports/Templates/*Bill.rdlc'
      - 'Pages/Reports/Templates/*Receipt.rdlc'
      - 'Tests/ThemeSmokeChecks/Program.Fee*.cs'
      - 'Tests/ThemeSmokeChecks/Program.Receipt*.cs'
      - 'Tests/ThemeSmokeChecks/Program.FamilyDocumentSections.cs'
      - 'Tests/ThemeSmokeChecks/ThemeSmokeChecks.csproj'
      - '.github/workflows/fmsc-fee-documents.yml'
  pull_request:
    paths:
      - 'Core/AdmissionBillReport*.cs'
      - 'Core/ReceiptReportLayout.cs'
      - 'Core/Reports/Fees/**'
      - 'Tests/ThemeSmokeChecks/Program.FamilyDocumentSections.cs'
      - 'Tests/ThemeSmokeChecks/ThemeSmokeChecks.csproj'
      - 'Pages/Reports/Templates/*Bill.rdlc'
      - 'Pages/Reports/Templates/*Receipt.rdlc'
      - 'Tests/ThemeSmokeChecks/Program.Fee*.cs'
      - 'Tests/ThemeSmokeChecks/Program.Receipt*.cs'
      - '.github/workflows/fmsc-fee-documents.yml'

permissions:
  contents: read

concurrency:
  group: fee-document-scenarios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Review bill and payment receipt scenarios
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Render fee documents without a database
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/fee-documents | Out-Null
          Copy-Item Docs/FEE_DOCUMENT_REVIEW_PACK.md artifacts/fee-documents/README.md
          dotnet run --project Tests/ThemeSmokeChecks/ThemeSmokeChecks.csproj -c Release -- --fee-document-review-pack 2>&1 | Tee-Object -FilePath artifacts/fee-documents/render.log
          $renderExit = $LASTEXITCODE
          if ($renderExit -ne 0) {
            $detail = (Get-Content artifacts/fee-documents/render.log -Tail 40) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Fee document rendering failed::$detail"
          }
          exit $renderExit
      - name: Upload the single review PDF
        id: samples
        if: ${{ success() && hashFiles('artifacts/fee-documents/FMSC-Fee-Bills-and-Receipts-Review.pdf') != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/fee-documents/FMSC-Fee-Bills-and-Receipts-Review.pdf
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Link review pack in the workflow summary
        if: ${{ always() && steps.samples.outcome == 'success' }}
        shell: pwsh
        env:
          REVIEW_ARTIFACT_URL: ${{ steps.samples.outputs.artifact-url }}
        run: |
          "[Download the single bill and receipt review PDF]($env:REVIEW_ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path artifacts/fee-documents/provenance.json) {
            $review = Get-Content artifacts/fee-documents/provenance.json -Raw | ConvertFrom-Json
            "Scenarios: $($review.ScenarioCount). PDF pages: $($review.PageCount). Checks: $($review.Checks)." >> $env:GITHUB_STEP_SUMMARY
          }
          'The download contains only FMSC-Fee-Bills-and-Receipts-Review.pdf. Use its bookmarks to navigate all scenarios. No duplicate individual PDFs or PNG previews are included.' >> $env:GITHUB_STEP_SUMMARY
