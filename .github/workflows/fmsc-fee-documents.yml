name: Fee document rendering

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Core/AdmissionBillReport*.cs'
      - 'Core/ReceiptReportLayout.cs'
      - 'Pages/Reports/Templates/*Bill.rdlc'
      - 'Pages/Reports/Templates/*Receipt.rdlc'
      - 'Tests/ThemeSmokeChecks/Program.FeeDocuments.cs'
      - '.github/workflows/fmsc-fee-documents.yml'

permissions:
  contents: read

jobs:
  render:
    name: Render fictional bills and receipts
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Render fee documents without a database
        run: dotnet run --project Tests/ThemeSmokeChecks/ThemeSmokeChecks.csproj -c Release -- --fee-documents
      - name: Upload fictional document previews
        uses: actions/upload-artifact@v7
        with:
          name: fee-document-previews
          path: artifacts/fee-documents/
          if-no-files-found: error
          retention-days: 7
