name: '02 - CI - Disposable Windows SQL Smoke'

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Complete installation acceptance, or focused disposable SQL checks'
        type: choice
        options: [complete, sql]
        default: complete
  # Every PR that changes migration or installer behavior must prove the
  # complete Windows + SQL path on a disposable runner before merge.
  pull_request:
    paths:
      - 'Migrations/**'
      - 'Installer/**'
      - 'DatabaseHelper.cs'
      - 'Core/DatabaseCompatibility.cs'
      - 'Services/Communication/Schema.sql'
      - 'Tests/LifecycleSqlChecks/Baseline/**'
      - 'Tools/RunDisposableWindowsInstall.ps1'
      - 'Tools/TestPreparedUpdateRecovery.ps1'
      - 'Tools/TestUpdateRecoverySql.ps1'
      - '.github/workflows/fmsc-disposable-windows-install.yml'
      - '.github/workflows/fmsc-windows-download.yml'
  workflow_call:
    inputs:
      test_scope:
        description: 'Acceptance mode requested by the release gate'
        required: false
        type: string
        default: complete
permissions:
  contents: read

concurrency:
  group: fmsc-disposable-windows-install
  cancel-in-progress: false

jobs:
  clean-install:
    name: Public synthetic SQL installer smoke (not release acceptance)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      FMSC_DISPOSABLE_INSTALL: approved-synthetic-only
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Check out this commit (no school data or secrets)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install full FMSC package with committed data-free synthetic baseline
        if: ${{ inputs.test_scope != 'sql' }}
        shell: pwsh
        timeout-minutes: 45
        run: .\Tools\RunDisposableWindowsInstall.ps1 -ProjectDirectory . -Level3

      - name: Restore pinned SQL test tooling for focused acceptance
        if: ${{ inputs.test_scope == 'sql' }}
        shell: pwsh
        run: dotnet tool restore --tool-manifest Tests/LifecycleSqlChecks/.config/dotnet-tools.json

      - name: Exercise automatic billing, concessions, credit and lifecycle cutoff cases
        shell: pwsh
        timeout-minutes: 10
        run: .\Tools\TestAutomaticBilling.ps1

      - name: Recover interrupted migrations and restore verified backup on disposable databases
        if: ${{ !cancelled() }}
        shell: pwsh
        timeout-minutes: 10
        run: .\Tools\TestUpdateRecoverySql.ps1

      - name: Publish sanitized acceptance summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fmsc-disposable-install-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fmsc-install-evidence/report.json
            ${{ runner.temp }}/fmsc-install-evidence/summary.md
          if-no-files-found: warn
          retention-days: 7

# Public PR and release-branch smoke checks use only a pinned, committed
# synthetic test baseline. They are NOT a production release acceptance.
# Actual schema-3/schema-7 MDF/LDF acceptance runs in private FMSC-Sandbox,
# and its successful exact-commit status is mandatory for Workflow 04.
# The root fmsc.dacpac is manual inspection material and is never referenced.
