name: '07 - Review - Dashboard Reports (PDF and Print)'

on:
  workflow_dispatch:
  push:
    branches: [main, chore/direct-pdf-export-evidence, fix/pdf-review-fidelity, fix/direct-pdf-export-context]
    paths:
      - 'Core/GridReportPreview.cs'
      - 'Core/ManagementReportPrintLayout.cs'
      - 'Core/FamilyAdvanceReport.cs'
      - 'Tests/ThemeSmokeChecks/Program.CompactManagementReports.cs'
      - 'Tests/ThemeSmokeChecks/Program.FamilyAdvanceLayout.cs'
      - 'Core/ReportContextProjection.cs'
      - 'Core/V2Page.cs'
      - 'Pages/Reports/Finance/CanonicalFinanceReportPage.cs'
      - 'Pages/Reports/Students/StudentReportsPage.cs'
      - 'Tests/ThemeSmokeChecks/Program.ActualPdfExport.cs'
      - 'Core/GridReportColumns.cs'
      - 'Core/ReportExportBuilder.cs'
      - 'Core/ReportPrintSummary.cs'
      - 'Core/ReportAvailableColumns.cs'
      - 'Core/ReportStudentIdentity.cs'
      - 'Core/StudentIdentityText.cs'
      - 'Pages/Reports/Finance/CreditBalanceReportData.cs'
      - 'Pages/Reports/Templates/Class*.rdlc'
      - 'Core/CollectionReceiptPresentation.cs'
      - 'Core/CollectionReceiptGrouping.cs'
      - 'Core/CollectionReceiptRdlc.cs'
      - 'Tests/ThemeSmokeChecks/Program.GridPdf.cs'
      - 'Tests/ThemeSmokeChecks/Program.DirectPdfReview.cs'
      - 'Tests/ThemeSmokeChecks/Program.DashboardReportScenarios.cs'
      - 'Tests/ThemeSmokeChecks/Program.DashboardReportCoverage.cs'
      - 'Tests/ThemeSmokeChecks/Program.ReportStudentIdentity.cs'
      - 'Tests/ThemeSmokeChecks/Program.ReportCaptions.cs'
      - 'Tests/ThemeSmokeChecks/Program.CollectionReceiptPresentation.cs'
      - 'Tests/ThemeSmokeChecks/Program.ReceiptExportReview.cs'
      - 'Tests/ThemeSmokeChecks/Program.cs'
      - '.github/workflows/fmsc-direct-pdf-exports.yml'
  pull_request:
    paths:
      - 'Core/GridReportPreview.cs'
      - 'Core/ManagementReportPrintLayout.cs'
      - 'Core/FamilyAdvanceReport.cs'
      - 'Tests/ThemeSmokeChecks/Program.CompactManagementReports.cs'
      - 'Tests/ThemeSmokeChecks/Program.FamilyAdvanceLayout.cs'
      - 'Core/ReportContextProjection.cs'
      - 'Core/V2Page.cs'
      - 'Pages/Reports/Finance/CanonicalFinanceReportPage.cs'
      - 'Pages/Reports/Students/StudentReportsPage.cs'
      - 'Tests/ThemeSmokeChecks/Program.ActualPdfExport.cs'
      - 'Core/GridReportColumns.cs'
      - 'Core/ReportExportBuilder.cs'
      - 'Core/ReportPrintSummary.cs'
      - 'Core/ReportAvailableColumns.cs'
      - 'Core/ReportStudentIdentity.cs'
      - 'Core/StudentIdentityText.cs'
      - 'Pages/Reports/Finance/CreditBalanceReportData.cs'
      - 'Pages/Reports/Templates/Class*.rdlc'
      - 'Core/CollectionReceiptPresentation.cs'
      - 'Core/CollectionReceiptGrouping.cs'
      - 'Core/CollectionReceiptRdlc.cs'
      - 'Tests/ThemeSmokeChecks/Program.GridPdf.cs'
      - 'Tests/ThemeSmokeChecks/Program.DirectPdfReview.cs'
      - 'Tests/ThemeSmokeChecks/Program.DashboardReportScenarios.cs'
      - 'Tests/ThemeSmokeChecks/Program.DashboardReportCoverage.cs'
      - 'Tests/ThemeSmokeChecks/Program.ReportStudentIdentity.cs'
      - 'Tests/ThemeSmokeChecks/Program.ReportCaptions.cs'
      - 'Tests/ThemeSmokeChecks/Program.CollectionReceiptPresentation.cs'
      - 'Tests/ThemeSmokeChecks/Program.ReceiptExportReview.cs'
      - 'Tests/ThemeSmokeChecks/Program.cs'
      - '.github/workflows/fmsc-direct-pdf-exports.yml'

permissions:
  contents: read

concurrency:
  group: direct-pdf-exports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Review dashboard reports, including compact layouts
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Generate and verify dashboard report PDFs
        id: render
        shell: pwsh
        run: |
          & dotnet run --project Tests/ThemeSmokeChecks/ThemeSmokeChecks.csproj -c Release -- --direct-pdf-review 2>&1 | Tee-Object -Variable renderOutput
          $renderExit = $LASTEXITCODE
          if ($renderExit -ne 0) {
            $detail = ($renderOutput | Select-Object -Last 40) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Dashboard report PDF review failed::$detail"
          }
          exit $renderExit
      - name: Upload the dashboard report review PDF
        id: samples
        if: ${{ success() && hashFiles('artifacts/direct-pdf-review/FMSC-Dashboard-Reports-Review.pdf') != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/direct-pdf-review/FMSC-Dashboard-Reports-Review.pdf
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Link dashboard report review PDF in run summary
        if: ${{ always() && steps.samples.outcome == 'success' }}
        shell: pwsh
        env:
          SAMPLE_ARTIFACT_URL: ${{ steps.samples.outputs.artifact-url }}
          SAMPLE_COMMIT: ${{ github.sha }}
          SAMPLE_CHECK_OUTCOME: ${{ steps.render.outcome }}
        run: |
          "[Download the dashboard report review PDF]($env:SAMPLE_ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
          "Source commit: $env:SAMPLE_COMMIT. Export checks: $env:SAMPLE_CHECK_OUTCOME." >> $env:GITHUB_STEP_SUMMARY
          $review = Get-Content artifacts/direct-pdf-review/provenance.json -Raw | ConvertFrom-Json
          "Scenarios: $($review.ScenarioCount). PDF pages: $($review.PageCount). SHA-256: $($review.Sha256)." >> $env:GITHUB_STEP_SUMMARY
          'The download is FMSC-Dashboard-Reports-Review.pdf, without a ZIP. Its bookmarks navigate every report scenario, including every page of wide reports. Fictional data rendered with the production export code on Windows.' >> $env:GITHUB_STEP_SUMMARY
